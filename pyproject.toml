[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scenarioflow"
version = "0.1.0"
description = "Temporal foundation model for conditional market scenario generation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "scikit-learn>=1.7",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "torch>=2.2",
    "tqdm>=4.67",
    "yfinance>=0.2.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]
baseline-classical = ["arch>=7"]
baseline-deep = []
demo-openai = ["openai>=1"]
demo-server = ["gradio>=6.14", "plotly>=6.3"]
paper = []

[project.scripts]
scenarioflow = "scenarioflow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:enable_nested_tensor is True.*:UserWarning",
]

[tool.setuptools.packages.find]
where = ["src"]
