[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scenarioflow"
version = "0.1.0"
description = "Conditional market-scenario generation research release"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
baseline-classical = ["arch>=7"]
baseline-deep = []
demo-openai = ["openai>=1"]
paper = ["matplotlib>=3.8"]

[project.scripts]
scenarioflow = "scenarioflow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:enable_nested_tensor is True.*:UserWarning",
]

[tool.setuptools.packages.find]
where = ["src"]
