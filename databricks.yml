bundle:
  name: scenarioflow
  databricks_cli_version: ">=0.218.0"

include:
  - deploy/databricks/resources.yml

variables:
  image_url:
    description: Registry URL of the separately built ScenarioFlow Databricks image.
  gpu_node_type:
    description: GPU node type available in the target Databricks workspace.
  spark_version:
    description: Databricks Runtime matching the custom image.
    default: 18.3.x-scala2.13
  artifact_root:
    description: Volume directory containing fetched ScenarioFlow artifacts.
    default: /Volumes/main/default/scenarioflow/artifacts
  output_root:
    description: Volume directory for checkpoints and numerical results.
    default: /Volumes/main/default/scenarioflow/results

workspace:
  root_path: ~/.bundle/${bundle.name}/${bundle.target}

targets:
  dev:
    default: true
    mode: development
  release:
    mode: production
