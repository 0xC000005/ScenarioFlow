server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /g1/ {
        set $narrative_to_scenario narrative-to-scenario:7860;
        rewrite ^/g1/(.*)$ /$1 break;
        proxy_pass http://$narrative_to_scenario;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /g2/ {
        set $scenario_to_narrative scenario-to-narrative:7861;
        rewrite ^/g2/(.*)$ /$1 break;
        proxy_pass http://$scenario_to_narrative;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
