name: Publish runtime container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the v1.0.0 release
        uses: actions/checkout@v6
        with:
          ref: v1.0.0

      - name: Enable cross-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/0xc000005/scenarioflow:v1.0.0
          labels: |
            org.opencontainers.image.source=https://github.com/0xC000005/ScenarioFlow
            org.opencontainers.image.version=v1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
